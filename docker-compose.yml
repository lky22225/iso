services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iso
      POSTGRES_PASSWORD: iso
      POSTGRES_DB: iso
    ports:
      - "5432:5432"
    volumes:
      - iso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iso -d iso"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  iso_pgdata:
